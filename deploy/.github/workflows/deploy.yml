name: deploy-validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract-check dependency
        run: python -m pip install -r requirements-contract.txt

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Prepare environment configuration
        run: make prepare

      - name: Validate Compose and static smoke checks
        run: make smoke-check

      - name: Validate contracts
        continue-on-error: true
        run: make contract-check
